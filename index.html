<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InCadence Care — Client portal</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Newsreader:wght@500;700&family=Manrope:wght@500;600;700&display=swap">
<style>
:root{--gold:#C09B36;--ink:#1C2A3A;--ground:#F6F4EF;--panel:#FBFAF7;--line:#E3DED3;--line2:#C9C2B4;--muted:#5B6470;--faint:#8A8F98;--tint:#F0E7CF}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Manrope',system-ui,-apple-system,sans-serif;background:var(--ground);color:var(--ink);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:500;letter-spacing:-.01em;margin:0}
h1{font-size:34px;line-height:1.15}h2{font-size:24px}h3{font-size:19px;line-height:1.25}
a{color:var(--ink)}a:hover{color:var(--gold)}
button,input,textarea,select{font-family:inherit;font-size:15px;color:var(--ink)}
input,textarea,select{width:100%;border:1px solid var(--line2);border-radius:3px;background:#fff;padding:11px 14px}
textarea{resize:vertical;min-height:88px}
label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.field{margin-bottom:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:3px;border:0;background:var(--gold);color:#fff;font-weight:700;cursor:pointer;text-decoration:none}
.btn:hover{background:#A98630;color:#fff}
.btn.quiet{background:#fff;color:var(--ink);border:1px solid var(--line2);height:38px;padding:0 14px;font-size:13px}
.btn.quiet:hover{background:var(--tint)}
.btn.block{width:100%}
.k{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:13px}
.card{background:#fff;border:1px solid var(--line);border-radius:3px;padding:24px}
.note{padding:16px 20px;border-radius:3px;background:var(--tint);font-size:14px}
.err{color:#9B2C2C;font-size:14px;margin-top:8px}
.ok{color:#2F6B3A;font-size:14px;margin-top:8px}
.hidden{display:none !important}

/* site header — same as www.incadencecare.com */
.sitebar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid #CDD7E0}
.sitebar-in{padding:12px clamp(20px,4vw,56px);display:flex;align-items:center;justify-content:space-between;gap:20px}
.lockup{display:flex;align-items:center;text-decoration:none}
.lockup svg{height:35px;width:auto;display:block}
.sitenav{display:flex;align-items:center;gap:24px;font-size:16px}
.sitenav a.nl{color:#33414F;text-decoration:none;font-weight:500}
.sitenav a.nl:hover{color:var(--ink)}
.sitenav .whoami{font-size:14px;color:#33414F;display:flex;align-items:center;gap:10px}
.sitenav .whoami select{width:auto;padding:7px 10px;font-size:14px}
.sitenav .av{width:32px;height:32px;border-radius:16px;background:var(--tint);color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',Georgia,serif;font-size:14px;font-weight:600}
.ic-cta--sm{display:inline-block;white-space:nowrap;padding:9px 18px;border-radius:3px;background:transparent;color:var(--ink);font-weight:700;font-size:15px;text-decoration:none;box-shadow:inset 0 0 0 1.5px var(--gold);cursor:pointer;border:0;font-family:inherit}
.ic-cta--sm:hover{background:var(--gold);color:var(--ink)}

/* welcome band + tiles */
.hero{position:relative;background:var(--ink);padding:34px 20px 0;text-align:center;overflow:visible;overflow-x:clip}
.hero .curve{position:absolute;left:-10%;right:-10%;bottom:-120px;height:220px;border-radius:50%;background:var(--ground);pointer-events:none}
.hero .hero-in{position:relative;min-height:96px}
.hero .hello{font-family:'Fraunces',Georgia,serif;font-size:40px;font-weight:500;letter-spacing:-.01em;color:#fff;margin:8px 0 0}
.tiles{position:relative;display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin:26px auto 0;transform:translateY(46px);max-width:1400px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;width:112px;height:116px;background:#fff;border-radius:10px;box-shadow:0 8px 24px rgba(28,42,58,.18);text-decoration:none;color:var(--ink);font-size:14px;font-weight:700;position:relative;border-top:4px solid transparent}
.tile svg{width:34px;height:34px;fill:none;stroke:var(--ink);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tile:hover{color:var(--ink);transform:translateY(-2px)}
.tile.on{border-top-color:var(--gold)}
.tile.on svg{stroke:var(--gold)}
.tile .pill{position:absolute;top:10px;right:10px;min-width:22px;height:22px;border-radius:11px;background:var(--gold);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px}
.main{position:relative;z-index:1;padding:84px 48px 60px}
.wrap{max-width:1040px;margin:0 auto}
.head{display:flex;flex-direction:column;gap:8px;margin-bottom:28px}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:32px}
.stack{display:flex;flex-direction:column;gap:20px}

/* timeline */
.tl{position:relative;margin:8px 0 32px}
.tl .bar{position:absolute;left:7%;right:7%;top:11px;height:2px;background:var(--line)}
.tl .stops{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.tl .stop{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.tl .dot{width:24px;height:24px;border-radius:12px;background:var(--ground);border:2px solid var(--line2);display:flex;align-items:center;justify-content:center}
.tl .stop.past .dot{background:var(--ink);border-color:var(--ink)}
.tl .stop.now .dot{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 5px var(--tint)}
.tl .lab{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:0 4px}
.tl .stop.past .lab{color:var(--muted)}.tl .stop.now .lab{color:var(--ink)}

/* lists */
.group{margin-bottom:22px}
.group .k{display:block;margin-bottom:4px}
.row{display:flex;align-items:flex-start;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.row svg{width:20px;height:20px;flex-shrink:0;margin-top:2px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row .t{flex-grow:1}
.row .d{font-size:13px;color:var(--muted);margin-top:2px}
.st{font-size:12px;font-weight:700;white-space:nowrap;color:var(--faint)}
.st.doing{color:var(--gold)}.st.done{color:var(--muted)}.st.blocked{color:#9B2C2C}
.row select{width:auto;padding:6px 10px;font-size:13px}

/* messages */
.thread{display:flex;flex-direction:column;gap:18px;margin:8px 0 24px}
.day{align-self:center;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.msg{display:flex;gap:12px;align-items:flex-end;max-width:640px}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg .av{width:36px;height:36px;border-radius:18px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',Georgia,serif;font-size:16px;flex-shrink:0}
.msg .b{padding:14px 18px;border-radius:3px;background:#fff;border:1px solid var(--line);white-space:pre-wrap}
.msg.me .b{background:var(--ink);color:#fff;border-color:var(--ink)}
.msg .m{font-size:12px;color:var(--faint);margin-top:6px}
.msg.me .m{text-align:right}

/* updates */
.post{margin-bottom:20px}
.post .tag{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);padding:5px 10px;border-radius:3px;background:var(--tint);margin-right:10px}
.post p{white-space:pre-wrap;margin:10px 0 0;font-size:16px;line-height:1.6}

/* circle */
.mem{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.mem .av{width:40px;height:40px;border-radius:20px;background:var(--tint);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',Georgia,serif;font-size:17px;flex-shrink:0}
.mem .t{flex-grow:1}

/* intake */
.prog{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--muted);margin-bottom:22px}
.prog .bar{flex-grow:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--gold)}
.q{padding:22px 0;border-bottom:1px solid var(--line)}
.q .qt{font-size:17px;font-weight:700;line-height:1.35}
.q .qt .req{color:var(--gold)}
.q .qw{font-size:14px;color:var(--muted);margin-top:6px;line-height:1.5}
.q .ctl{margin-top:14px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;padding:12px 16px;border:1px solid var(--line2);border-radius:3px;background:#fff;cursor:pointer;text-align:left;width:100%;font-size:15px;line-height:1.35}
.opt:hover{background:var(--tint)}
.opt.on{border-color:var(--gold);background:var(--tint);font-weight:700}
.opt i{width:18px;height:18px;border-radius:9px;border:2px solid var(--line2);flex-shrink:0}
.opt.on i{border-color:var(--gold);background:var(--gold);box-shadow:inset 0 0 0 3px var(--tint)}
.opt.box i{border-radius:3px}
.alts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.alt{padding:8px 12px;border:1px solid var(--line2);border-radius:3px;background:#fff;font-size:13px;cursor:pointer}
.alt.on{border-color:var(--gold);background:var(--tint);font-weight:700}
.detail{margin-top:10px}
.notel{display:inline-block;margin-top:0;font-size:13px;color:var(--muted);cursor:pointer;text-decoration:underline;background:none;border:0;padding:12px 0;min-height:44px;font-family:inherit}
.qerr{margin-top:8px;font-size:14px;color:#9B2C2C;font-weight:600}
.note-f{margin-top:10px}.note-f textarea{min-height:64px;font-size:14px}
.q .err{margin-top:8px}
.q.bad .qt{color:#9B2C2C}
.steps{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-top:24px}
.con{padding:14px 0;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:flex-start}
.con input{width:64px;text-align:center;text-transform:uppercase;font-weight:700;flex-shrink:0}
.con .t{font-size:14px;line-height:1.5}
.flag{padding:10px 14px;border-left:3px solid var(--gold);background:#fff;border-radius:0 3px 3px 0;margin-bottom:6px;font-size:14px}
.flag.t1{border-color:#9B2C2C}
.ans{padding:12px 0;border-bottom:1px solid var(--line)}
.ans .qq{font-size:13px;color:var(--muted)}
.ans .aa{font-size:15px;margin-top:2px}
.ans .aa.dk{color:#9B2C2C;font-weight:700}
.ans .nn{margin-top:8px;padding:10px 14px;border-left:3px solid var(--gold);background:var(--tint);font-size:14px;white-space:pre-wrap}
.ans .nn b{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.draft{border:1px dashed var(--line2);border-radius:3px;padding:14px 16px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start}
.draft .t{flex-grow:1}.draft .d{font-size:13px;color:var(--muted)}
.draft .bs{display:flex;gap:6px;flex-shrink:0}

/* sign-in */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gate .card{width:100%;max-width:460px;padding:36px}

/* supporter top bar */
.top{height:68px;padding:0 48px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:var(--panel)}
.center{max-width:680px;margin:0 auto;padding:44px 24px 60px}

.brief{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr);gap:36px}
.bd{display:flex;align-items:baseline;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:6px}
.bd h2{font-size:32px}
.bdays{font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.bsum{font-size:16px;line-height:1.65;margin:10px 0 0}
.bsec{margin-top:28px}
.tm{display:flex;gap:16px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.tm .tt{width:84px;flex-shrink:0;font-size:14px;font-weight:700}
.tm .t{font-size:15px}.tm .d{font-size:13px;color:var(--muted);margin-top:2px}
.tm.hot .tt{color:var(--gold)}.tm.hot .t{font-weight:700}
.chk{width:20px;height:20px;border-radius:4px;border:2px solid #C9C2B4;background:#fff;flex-shrink:0;margin-top:2px;padding:0;cursor:pointer}
.chk.rd{border-radius:10px}.chk.on{background:var(--gold);border-color:var(--gold)}
.row.done .t{color:var(--faint);text-decoration:line-through}
.btn.sm{height:auto;padding:7px 12px;font-size:13px}
.ap{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.ap .r{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.ap .r.hot{color:var(--gold)}.ap .x{color:var(--faint);text-decoration:none;font-size:16px;margin-left:6px}
.rad{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.rad svg{width:16px;height:16px;flex-shrink:0;fill:none;stroke:var(--faint);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-top:2px}
.rad .d{font-size:12px;color:var(--muted)}
.tag{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
.lk{display:flex;align-items:center}
.ib{width:40px;height:40px;border-radius:3px;border:1.5px solid #CDD7E0;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-left:16px;text-decoration:none}
.ib svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib.on{border-color:var(--gold)}.ib.on svg{stroke:var(--gold)}
.mz{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;min-height:560px;height:calc(100vh - 170px);max-height:820px}
.ml,.mr{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:3px;overflow:hidden;min-height:0}
.mlh{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 8px}
.mtabs{display:flex;gap:4px}.mtabs a{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:6px 8px;border-radius:3px}.mtabs a.on{color:var(--gold);background:var(--tint)}
.mplus{width:34px;height:34px;border-radius:17px;border:1.5px solid #C9C2B4;display:flex;align-items:center;justify-content:center;text-decoration:none;flex-shrink:0}.mplus svg{width:18px;height:18px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.msrch{padding:0 12px 8px}.msrch input{height:38px;border-radius:19px;background:var(--ground);border:0;padding:0 14px;font-size:14px}
.mlist{overflow:auto;padding:0 6px 8px;display:flex;flex-direction:column;gap:2px;flex-grow:1}
.mt{display:flex;gap:10px;align-items:flex-start;padding:11px 10px;border-radius:8px;text-decoration:none;color:var(--ink)}
.mt .dot{width:8px;flex-shrink:0;margin-top:16px}.mt .dot.un{height:8px;border-radius:4px;background:var(--gold)}
.mt .av,.mrh .av{width:40px;height:40px;border-radius:20px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',Georgia,serif;flex-shrink:0}
.mt .av.sys,.mrh .av.sys{background:var(--tint)}.mt .av.sys svg,.mrh .av.sys svg{width:18px;height:18px;fill:none;stroke:var(--gold);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mt .tx{flex-grow:1;min-width:0}.mt .r1{display:flex;justify-content:space-between;gap:10px}.mt .tt{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mt .when{font-size:12px;color:var(--muted);white-space:nowrap}
.mt .pv{font-size:13px;color:var(--muted);line-height:1.4;max-height:36px;overflow:hidden}
.mt.on{background:var(--ink);color:#fff}.mt.on .when,.mt.on .pv{color:#D8D2C4}.mt.on .av{background:#fff;color:var(--ink)}
.mrh{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #EEEAE0}.mrh .tx{flex-grow:1;min-width:0}.mrh .tt{font-size:16px;font-weight:700}.mrh .sub{font-size:13px;color:var(--muted)}
.mrh .back{display:none;text-decoration:none;font-weight:700;white-space:nowrap}
.ib.sm{width:36px;height:36px;margin:0}
.mbody{flex-grow:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.mbody .day{margin:4px 0}
.bub{display:flex;flex-direction:column;align-items:flex-start;max-width:78%}.bub.me{align-self:flex-end;align-items:flex-end}
.bub .b{padding:10px 14px;border-radius:16px;border-bottom-left-radius:4px;background:var(--tint);white-space:pre-wrap;font-size:15px;line-height:1.45}
.bub.me .b{background:var(--gold);color:#fff;border-radius:16px;border-bottom-right-radius:4px}
.bub.sys .b{background:#fff;border:1px solid var(--line)}
.bub .m{font-size:11px;color:var(--faint);margin-top:3px}
.mcomp{display:flex;gap:10px;align-items:flex-end;padding:12px 14px;border-top:1px solid #EEEAE0;flex-wrap:wrap}
.mcomp textarea{flex-grow:1;min-height:42px;height:42px;border-radius:21px;padding:10px 16px;resize:none;font-size:15px;width:auto}
.mcomp .btn{height:42px;border-radius:21px}.mcomp .attb{cursor:pointer;margin:0 0 0}.mcomp .attb svg{width:20px;height:20px}.chip2{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:var(--tint);border-radius:12px;padding:3px 10px;margin:6px 6px 0 0}.chip2 a{text-decoration:none;font-weight:700}.atts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.att{display:inline-flex;align-items:center;gap:6px;font-size:13px;background:#fff;border:1px solid var(--line);border-radius:3px;padding:5px 9px;text-decoration:none;max-width:260px}.att svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;flex-shrink:0}.att span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bub.me .att{background:rgba(255,255,255,.85)}.mcomp .urg{display:flex;align-items:center;gap:6px;font-size:13px;margin:0 0 12px;color:#9B2C2C;font-weight:700;cursor:pointer}.mcomp .urg input{width:auto}.bub.urgent .b{border:2px solid #9B2C2C}.bub .ut{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#9B2C2C;margin:0 0 3px}.seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}.seg a{padding:6px 12px;font-size:13px;font-weight:700;text-decoration:none;color:var(--muted);border-right:1px solid var(--line)}.seg a:last-child{border-right:0}.seg a.on{background:var(--tint);color:var(--ink)}
.mempty{padding:40px 24px;text-align:center}
.mnew{padding:22px 24px;overflow:auto}.mnew h2{margin:6px 0 14px}.mnew .back{display:none;text-decoration:none;font-weight:700}
.mnew .opts{display:flex;flex-direction:column;gap:8px}
.mnew .opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:3px;text-decoration:none;color:var(--ink);background:#fff}.mnew .opt:hover{background:var(--panel)}
.mnew .opt .t{font-size:15px;font-weight:700}.mnew .opt .d{font-size:13px;color:var(--muted);margin-top:2px}.mnew .opt svg{width:18px;height:18px;flex-shrink:0;fill:none;stroke:var(--gold);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.mnew .oth{display:flex;gap:8px;margin-top:10px}.mnew .oth input{height:44px}.mnew .oth .btn{height:44px}
.mnew .warn,.warn{margin-top:16px;padding:10px 14px;background:#FBF3F1;border:1px solid #E9C9C2;border-radius:3px;font-size:13px;color:#7A2E2E}
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin:-10px 0 22px}.subnav a{font-size:13px;font-weight:700;text-decoration:none;color:var(--muted);padding:8px 12px;border-radius:3px;border:1px solid var(--line);background:#fff}.subnav a.on{color:var(--gold);border-color:var(--gold);background:var(--tint)}

function fmtDay(v){var d=new Date(v);if(isNaN(d))return'';var t=new Date();var y=new Date();y.setDate(t.getDate()-1);if(d.toDateString()===t.toDateString())return'Today';if(d.toDateString()===y.toDateString())return'Yesterday';return d.toLocaleDateString(undefined,{month:'long',day:'numeric'})}
function fmtTime(v){var d=new Date(v);return isNaN(d)?'':d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}
function famName(n){n=String(n||'').trim();return /family$/i.test(n)?'The '+n:'The '+n+' family'}
function famLower(n){return famName(n).replace(/^The /,'the ')}
function first(name){return String(name||'').trim().split(' ')[0]}
function initial(name){return (String(name||'?').trim()[0]||'?').toUpperCase()}
function stClass(s){s=String(s||'');return s==='Done'?'done':s==='In progress'?'doing':s==='Blocked'?'blocked':''}
function stIcon(s){s=String(s||'');return s==='Done'?ICON.done:s==='In progress'?ICON.doing:s==='Blocked'?ICON.blocked:ICON.todo}
function stWord(s,co){s=String(s||'Not started');if(s==='In progress')return co?(first(co.name)+' is on it'):'In progress';return s}
function call(action,payload){return new Promise(function(res,rej){google.script.run.withSuccessHandler(function(r){if(!r||!r.ok){if(r&&r.error==='signed_out'){signOut();return}rej(new Error(r&&r.error||'Something went wrong'));return}res(r)}).withFailureHandler(function(e){rej(e)}).api(S.session,action,Object.assign({clientId:S.clientId},payload||{}))})}
function signOut(){S.session=null;S.data=null;store('ic_session',null);render()}

// ---------------------------------------------------------------- boot
(function(){
  var q=new URLSearchParams(location.search),t=q.get('t')||'',e=q.get('e')||'',card=q.get('card')||'';
  if(t||e||card)history.replaceState(null,'',location.pathname);
  $('#app').innerHTML='<div class="gate"><div class="muted">Opening the portal&hellip;</div></div>';
  google.script.run.withSuccessHandler(function(r){
    if(r&&r.ok&&r.boot)Object.keys(r.boot).forEach(function(k){BOOT[k]=r.boot[k]});
    else BOOT.error=(r&&r.error)||'Could not reach the portal.';
    if(BOOT.session){S.session=BOOT.session;store('ic_session',BOOT.session)}
    else S.session=load('ic_session');
    S.clientId=load('ic_client')||'';
    if(card==='saved'){S.view='billing';S.bp='method';S.touched=true;S.cardSaved=true}
    render();
    if(S.session)refresh();
  }).withFailureHandler(function(err){
    $('#app').innerHTML='<div class="gate"><div class="card"><div class="k">'+esc(BOOT.appName)+'</div><h1 style="margin:12px 0">Could not reach the portal.</h1><p class="muted">'+esc(err&&err.message||err)+'</p><p><button class="btn" onclick="location.reload()">Try again</button></p></div></div>';
  }).api(null,'hello',{t:t,e:e});
})();

function refresh(){
  S.allBill=null;S.fullT={};return call('bootstrap').then(function(r){S.data=r;if(r.families&&r.families.length&&!S.clientId){S.clientId=r.families[0].client_id}if(r.client)S.clientId=r.client.client_id;if(r.me.role==='client'&&r.intake&&!isSub(r.intake)&&!S.touched)S.view='intake';if(S.ia===null||S.iaFor!==S.clientId){S.ia=null;S.step=null}render()}).catch(function(e){S.data={error:e.message};render()})
}

// ---------------------------------------------------------------- render
function render(){
  var app=$('#app');
  if(!S.session){app.innerHTML='';app.appendChild(gate());return}
  if(!S.data){app.innerHTML='<div class="gate"><div class="muted">Opening your portal&hellip;</div></div>';return}
  if(S.data.error){app.innerHTML='';app.appendChild(el('<div class="gate"><div class="card"><div class="k">'+esc(BOOT.appName)+'</div><h1 style="margin:12px 0">Something is off.</h1><p class="muted">'+esc(S.data.error)+'</p><p><button class="btn quiet" id="so">Sign out</button></p></div></div>'));$('#so').onclick=signOut;return}
  if(S.data.me.role==='supporter'){app.innerHTML='';app.appendChild(supporterPage());return}
  app.innerHTML='';app.appendChild(S.data.me.role==='coordinator'?coShell():shell());
}

// ---------------------------------------------------------------- sign-in
// Email + password; a new device also gets a 6-digit code by email. The emailed link is only for
// setting a password the first time, or choosing a new one.
function pre(action,payload){return new Promise(function(res){google.script.run.withSuccessHandler(function(r){res(r||{ok:false,error:'The portal did not answer. Try again in a moment.'})}).withFailureHandler(function(e){res({ok:false,error:(e&&e.message)||'Could not reach the portal. Try again in a moment.'})}).api(null,action,payload||{})})}
function signedIn(r){S.session=r.session;store('ic_session',r.session);if(r.device)store('ic_dev',r.device);S.auth=null;BOOT.pwset=null;BOOT.error=null;S.data=null;render();refresh()}
function gateCard(inner,top){var c=el('<div style="min-height:100vh;display:flex;flex-direction:column">'+siteheader()+'<div class="gate" style="flex:1;min-height:0;padding:clamp(40px,7vw,80px) 24px 64px;align-items:flex-start"><form class="card" novalidate>'+(top||'<div class="k">'+esc(BOOT.appName)+'</div>')+inner+'</form></div>'+sitefooter()+'</div>');return c}
function busy(b,on,label){b.disabled=on;if(label)b.textContent=label}
function gate(){

    pwWatch($('#p1',c),$('.pwck',c));

      var miss=pwMissing(a);if(miss.length){showErr('Your password still needs: '+miss.join(', ')+'.');return}

function resEmbed(u){

function resBodyEl(text){

}

  v.appendChild(el('<div class="head"><div class="k">Prep sheet</div><h1>'+esc(pf)+' — intake.</h1><div class="muted">'+esc(it.status)+(it.submitted_at?' · submitted '+esc(fmtDate(it.submitted_at)):'')+(it.consent?' · signed by '+esc(it.consent.name)+(it.consent.relationship?' ('+esc(it.consent.relationship)+')':''):'')+' · '+(c.paid?'<b style="color:var(--ink)">portal open</b>':c.plan_ready?'<b style="color:var(--gold)">plan sent, portal locked</b>':'<b style="color:#9B2C2C">plan not sent yet</b>')+'</div></div>'));
  var pb=el('<p style="margin:-10px 0 10px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn quiet" type="button" id="pr">'+(c.plan_ready?'Plan sent — take it back':'Plan is ready — send them the PDF')+'</button><button class="btn '+(c.paid?'quiet':'')+'" type="button" id="pd">'+(c.paid?'Lock the portal again':'Payment received — open their portal')+'</button><button class="btn quiet" type="button" id="pv">Preview the PDF</button><span class="err" style="margin:0"></span></p>');
  $('#pr',pb).onclick=function(){if(!c.plan_ready&&!confirm('Send the plan? The family gets an email and can read the PDF from their sign-in.'))return;call('setPlanReady',{ready:!c.plan_ready}).then(refresh).catch(alertErr)};
  $('#pd',pb).onclick=function(){if(c.paid&&!confirm('Lock the portal for this family?'))return;call('setPaid',{paid:!c.paid}).then(refresh).catch(alertErr)};
  $('#pv',pb).onclick=function(){openPdf(this,$('.err',pb))};
  v.appendChild(pb);
  var fb=el('<p style="margin:-10px 0 24px"><button class="btn quiet" type="button">'+(isSub(it)?'Change answers with them':'Fill it in with them — by phone or in person')+'</button></p>');$('button',fb).onclick=function(){S.coFill=true;S.ia=null;S.step=isSub(it)?1:null;render()};v.appendChild(fb);
  if(it.status==='Not started'){v.appendChild(el('<p class="muted">The family has not started the intake. They see it first when they sign in.</p>'));return v}
  var cols=el('<div class="cols"><section class="left"></section><aside class="stack"></aside></div>');var left=$('.left',cols),side=$('aside',cols);
  var tiers=[];flags.forEach(function(f){if(tiers.indexOf(f.tier)<0)tiers.push(f.tier)});
  var fl=el('<div class="card"><div class="k" style="margin-bottom:12px">Flags — '+flags.length+'</div></div>');
  if(!flags.length)fl.appendChild(el('<p class="small muted" style="margin:0">Nothing fired. Read the notes anyway.</p>'));
  tiers.forEach(function(t){fl.appendChild(el('<div class="small muted" style="margin:10px 0 6px;font-weight:700">'+esc(t)+'</div>'));flags.filter(function(f){return f.tier===t}).forEach(function(f){fl.appendChild(el('<div class="flag '+(/Tier 1/.test(t)?'t1':'')+'">'+esc(f.label)+' <span class="faint">· '+esc(f.id)+'</span></div>'))})});
  side.appendChild(fl);
  var drafts=(d.plan||[]).filter(isDraft).length;
  if(drafts)side.appendChild(el('<div class="note">'+drafts+' draft plan item'+(drafts===1?'':'s')+' from this intake are waiting on the Plan page.</div>'));
  side.appendChild(el('<div class="note">A declined question is information, not a gap. Never raise it in the meeting unless they open it.</div>'));
  left.appendChild(answersList(false));
  v.appendChild(cols);return v;
}

function isSub(it){return /Submitted|Updated/.test(String(it&&it.status||''))}
function isDraft(p){return p.draft===true||String(p.draft).toUpperCase()==='TRUE'}
function formData(f){var o={};$all('input,select,textarea',f).forEach(function(i){if(i.name)o[i.name]=i.type==='checkbox'?i.checked:i.value});return o}
function alertErr(e){alert(e&&e.message||e)}
</script>
</body>
